<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>photoshop-mirror demo scene</title>
<!--
  The whole demo is a pure function of time: render(t) draws frame t (seconds).
  render.mjs steps t at 30 fps and screenshots each frame.
  Open this file in a browser to scrub: add #t=5.2 to the URL, or #play to loop.
-->
<style>
  :root{
    --paper:#F2EFE8; --ink:#1A1A18; --ink-2:#6E6B63;
    --accent:#2B6CF6;
    --ui-0:#1C1C1E; --ui-1:#262628; --ui-2:#303033; --ui-line:#3A3A3D; --ui-text:#C9C9CC; --ui-dim:#7C7C82;
    --sans:"SF Pro Display","SF Pro Text",-apple-system,system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:800px;overflow:hidden;background:var(--paper);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  #cam{position:absolute;inset:0;transform-origin:0 0}
  .abs{position:absolute}

  /* ---------- captions ---------- */
  .cap{position:absolute;left:0;right:0;text-align:center;color:var(--ink);letter-spacing:-.02em}
  #intro{top:330px;font-size:52px;font-weight:600;line-height:1.15}
  #intro span{color:var(--ink-2)}
  #step{top:728px;font-size:19px;font-weight:500;color:var(--ink-2);letter-spacing:-.005em}
  #outro{top:262px}
  #outro h1{font-size:60px;font-weight:700;letter-spacing:-.035em}
  #outro p{font-size:22px;color:var(--ink-2);margin-top:14px;font-weight:500;letter-spacing:-.01em}
  #outro .cmd{display:inline-block;margin-top:38px;font:500 21px var(--mono);color:var(--paper);
    background:var(--ink);padding:16px 26px;border-radius:14px}
  #outro .cmd b{color:#8FB0FF;font-weight:500}
  #outro .url{margin-top:22px;font-size:16px;color:var(--ink-2);font-weight:500}

  /* ---------- editor window ---------- */
  #editor{left:56px;top:96px;width:832px;height:600px;border-radius:14px;background:var(--ui-0);overflow:hidden;
    box-shadow:0 40px 90px rgba(40,34,20,.20),0 10px 24px rgba(40,34,20,.10),0 0 0 1px rgba(0,0,0,.25)}
  #titlebar{height:34px;background:var(--ui-1);border-bottom:1px solid var(--ui-line);display:flex;align-items:center;
    padding:0 14px;gap:8px;color:var(--ui-dim);font-size:12.5px;font-weight:500}
  .tl{width:12px;height:12px;border-radius:50%}
  #titlebar .name{margin-left:14px;color:var(--ui-text)}
  #tools{left:0;top:34px;bottom:0;width:42px;background:var(--ui-1);border-right:1px solid var(--ui-line);
    display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:12px}
  #tools i{width:18px;height:18px;border-radius:4px;background:var(--ui-2);display:block}
  #tools i.on{background:#4A4A4F}
  #canvas{left:42px;top:34px;right:216px;bottom:0;background:#141415}
  #ablabel{position:absolute;font-size:11.5px;color:var(--ui-dim);font-weight:500}
  #panel{right:0;top:34px;bottom:0;width:216px;background:var(--ui-1);border-left:1px solid var(--ui-line);
    color:var(--ui-text);font-size:12px}
  .ph{padding:12px 14px 8px;font-size:11px;font-weight:600;color:var(--ui-dim);letter-spacing:.06em;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:8px;padding:0 14px;height:30px}
  .sw{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .sw.sel{box-shadow:0 0 0 2px var(--ui-1),0 0 0 3.5px #E8E8EA}
  .lay{display:flex;align-items:center;gap:9px;height:30px;padding:0 12px;margin:0 6px;border-radius:7px}
  .lay.sel{background:#3B4D7A}
  .eye{width:14px;height:9px;border-radius:50%;border:1.6px solid var(--ui-text);position:relative;flex:0 0 auto}
  .eye::after{content:"";position:absolute;left:3.2px;top:.6px;width:4px;height:4px;border-radius:50%;background:var(--ui-text)}
  .eye.off{border-color:#55555A}.eye.off::after{background:transparent}
  .thumb{width:20px;height:20px;border-radius:4px;background:var(--ui-2);flex:0 0 auto}
  .divider{height:1px;background:var(--ui-line);margin:10px 0 2px}

  /* ---------- phone ---------- */
  #phone{left:938px;top:84px;width:290px;height:624px;border-radius:52px;background:#0D0D0E;padding:11px;
    box-shadow:0 40px 90px rgba(40,34,20,.24),0 10px 24px rgba(40,34,20,.12),inset 0 0 0 1.5px #3A3A3C}
  #screen{position:relative;width:268px;height:602px;border-radius:42px;overflow:hidden;background:#FBFAF7}
  #island{position:absolute;left:50%;top:10px;width:84px;height:24px;margin-left:-42px;border-radius:14px;background:#000;z-index:5}
  #mbar{position:absolute;left:0;right:0;top:0;padding:44px 10px 10px;display:flex;gap:6px;align-items:center;z-index:4;
    background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent)}
  .chip{font-size:9.5px;font-weight:500;color:#fff;background:rgba(22,22,26,.9);border:1px solid rgba(255,255,255,.14);
    padding:5px 8px;border-radius:99px}
  .dot{width:6px;height:6px;border-radius:50%;background:#3DDC84;margin-left:auto}
  .clock{font-size:9px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}

  /* ---------- the app being designed (375×812 logical) ---------- */
  .app{position:absolute;left:0;top:0;width:375px;height:812px;background:#FBFAF7;transform-origin:0 0;
    font-family:var(--sans);color:#151513;overflow:hidden}
  .app .hi{position:absolute;left:24px;top:70px;font-size:15px;color:#8A877F;font-weight:500}
  .app .h1{position:absolute;left:24px;top:94px;font-size:32px;font-weight:700;letter-spacing:-.03em}
  .app .hero{position:absolute;left:20px;top:156px;width:335px;height:236px;border-radius:24px;overflow:hidden;
    background:linear-gradient(160deg,#FFD9A8 0%,#F59A7A 48%,#C86C8A 100%)}
  .app .sun{position:absolute;right:46px;top:40px;width:70px;height:70px;border-radius:50%;background:rgba(255,248,230,.85)}
  .app .hill1{position:absolute;left:-40px;right:-40px;bottom:-70px;height:170px;border-radius:50%;background:rgba(120,50,80,.45)}
  .app .hill2{position:absolute;left:120px;right:-120px;bottom:-90px;height:170px;border-radius:50%;background:rgba(90,35,70,.55)}
  .app .ht{position:absolute;left:22px;bottom:44px;font-size:27px;font-weight:700;color:#fff;letter-spacing:-.025em;white-space:nowrap}
  .app .hs{position:absolute;left:22px;bottom:22px;font-size:14px;color:rgba(255,255,255,.88);font-weight:500}
  .app .caret{display:inline-block;width:2.5px;height:28px;background:#fff;vertical-align:-4px;margin-left:2px}
  .app .badge{position:absolute;right:16px;top:16px;background:#151513;color:#fff;font-size:15px;font-weight:700;
    padding:8px 13px;border-radius:99px;letter-spacing:-.01em}
  .app .sec{position:absolute;left:24px;top:418px;font-size:18px;font-weight:700;letter-spacing:-.02em}
  .app .item{position:absolute;left:24px;width:327px;height:72px;display:flex;align-items:center;gap:14px}
  .app .item .ic{width:60px;height:60px;border-radius:16px}
  .app .item b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
  .app .item span{display:block;font-size:13.5px;color:#8A877F;margin-top:3px;font-weight:500}
  .app .cta{position:absolute;left:20px;bottom:44px;width:335px;height:58px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .app .sel-box{position:absolute;border:2px solid #4F8BFF;pointer-events:none}

  /* ---------- cursor ---------- */
  #cursor{position:absolute;left:0;top:0;width:22px;height:22px;z-index:50;transform-origin:3px 3px}
</style>
</head>
<body>
<div id="cam">
  <div class="cap" id="intro">Edit in Photoshop.<br><span>See it on your phone.</span></div>

  <div id="editor" class="abs">
    <div id="titlebar">
      <span class="tl" style="background:#FF5F57"></span><span class="tl" style="background:#FEBC2E"></span><span class="tl" style="background:#28C840"></span>
      <span class="name">home.psd @ 100%</span>
    </div>
    <div id="tools" class="abs"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="canvas" class="abs">
      <div id="ablabel">preview.png</div>
      <div id="edApp"></div>
    </div>
    <div id="panel" class="abs">
      <div class="ph">Fill</div>
      <div class="row" id="swatches"></div>
      <div class="divider"></div>
      <div class="ph">Layers</div>
      <div id="layers"></div>
    </div>
  </div>

  <div id="phone" class="abs">
    <div id="screen">
      <div id="island"></div>
      <div id="phApp"></div>
      <div id="mbar"><span class="chip">preview.png</span><span class="chip">Full width</span><span class="dot"></span><span class="clock" id="clock"></span></div>
    </div>
  </div>

  <div class="cap" id="outro">
    <h1>photoshop-mirror</h1>
    <p>Live Photoshop preview on your phone. Free and open source.</p>
    <div class="cmd"><b>$</b> psmirror home.psd</div>
    <div class="url">github.com/Vic-Chen-160/photoshop-mirror</div>
  </div>

  <svg id="cursor" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.2 14.2 L10 20.4 L12.8 19.2 L10.1 13.1 L15.6 13.1 Z"
    fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
</div>
<div class="cap" id="step"></div>

<script>
/* ---------- timeline (seconds) ---------- */
const DURATION = 19.5;
const LAG = 0.8;                       // phone shows a change this long after the editor
const K = {
  introIn:0.2, introOut:2.0, cardsIn:2.3,
  // 1 · button colour
  c1Move:3.6, c1Click:4.6,
  // 2 · headline text
  c2Move:7.6, c2Click:8.4, c2TypeA:8.7, c2TypeB:9.9,
  // 3 · layer visibility
  c3Move:12.2, c3Click:13.0,
  outro:15.6
};
const PUSHES = [                         // camera pushes onto the phone right after each change
  {a:K.c1Click+0.15, b:K.c1Click+LAG+2.0},
  {a:K.c2TypeB+0.1,  b:K.c2TypeB+LAG+1.9},
];

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const seg=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const lerp=(a,b,x)=>a+(b-a)*x;
const $=s=>document.querySelector(s);

/* ---------- design state at time t (what the editor shows) ---------- */
const FROM="Weekend in Kyoto", TO="Weekend in Taipei";
function design(t){
  let title=FROM, caret=false;
  if(t>=K.c2TypeA){
    // delete "Kyoto" then type "Taipei"
    const keep="Weekend in ".length, del=FROM.length-keep, add=TO.length-keep;
    const n=Math.floor((t-K.c2TypeA)/((K.c2TypeB-K.c2TypeA)/(del+add)));
    title = n<=del ? FROM.slice(0,FROM.length-n) : TO.slice(0,keep+Math.min(add,n-del));
  }
  if(t>=K.c2Click && t<K.c2TypeB+0.7) caret = Math.floor((t-K.c2Click)*2.2)%2===0 || (t>=K.c2TypeA && t<K.c2TypeB);
  return { cta: t>=K.c1Click, title, caret, badge: t>=K.c3Click };
}

function appHTML(d, editing){
  const cta = d.cta ? "background:var(--accent);color:#fff" : "background:#E4E2DC;color:#8A877F";
  const sel = editing && d.selected;
  return `<div class="app">
    <div class="hi">Good morning</div>
    <div class="h1">Plan your trip</div>
    <div class="hero"><div class="sun"></div><div class="hill1"></div><div class="hill2"></div>
      <div class="ht">${d.title}${editing&&d.caret?'<span class="caret"></span>':''}</div>
      <div class="hs">2 nights · from $420</div>
      ${d.badge?'<div class="badge">−20%</div>':''}
    </div>
    <div class="sec">Saved places</div>
    <div class="item" style="top:452px"><div class="ic" style="background:linear-gradient(135deg,#B8D8C8,#6FA58E)"></div><div><b>Jiufen Old Street</b><span>New Taipei · 4.8 ★</span></div></div>
    <div class="item" style="top:536px"><div class="ic" style="background:linear-gradient(135deg,#C9D3F2,#7B8DD6)"></div><div><b>Sun Moon Lake</b><span>Nantou · 4.9 ★</span></div></div>
    <div class="cta" style="${cta}">Book now</div>
    ${sel==="cta"?'<div class="sel-box" style="left:18px;bottom:42px;width:339px;height:62px;border-radius:20px"></div>':''}
    ${sel==="title"?'<div class="sel-box" style="left:38px;top:300px;width:300px;height:42px"></div>':''}
  </div>`;
}

/* ---------- layout constants ---------- */
const ED = {x:56,y:96};                       // editor origin in scene
const CANVAS = {x:42,y:34,w:832-42-216,h:600-34};
const AB_SCALE = 0.62, AB_W = 375*AB_SCALE, AB_H = 812*AB_SCALE;
const AB = {x:(CANVAS.w-AB_W)/2, y:(CANVAS.h-AB_H)/2+8};
const PH_SCALE = 268/375;
const PHONE_C = {x:938+145, y:84+312};       // phone centre, camera push target

const SW = ["#E4E2DC","#151513","#2B6CF6","#2FA36B","#E8613C"];
const LAYERS = [["−20% badge","badge"],["Book now","cta"],["Title","title"],["Hero"],["Saved places"],["Background"]];

// cursor targets, in scene coordinates
const abPt = (x,y)=>({x:ED.x+CANVAS.x+AB.x+x*AB_SCALE, y:ED.y+CANVAS.y+AB.y+y*AB_SCALE});
const swPt = i=>({x:ED.x+832-216+14+i*30+11, y:ED.y+34+ (12+16) + 15});
const layPt = i=>({x:ED.x+832-216+6+12+7, y:ED.y+34+28+30+11+18+16+i*30+15});
const CUR = [                                  // [time, point, click?]
  [0,        {x:560,y:620}],
  [K.c1Move, {x:560,y:620}],
  [K.c1Click-0.25, swPt(2)], [K.c1Click, swPt(2), 1],
  [K.c2Move, swPt(2)],
  [K.c2Click-0.2, abPt(170,320)], [K.c2Click, abPt(170,320), 1], [K.c2Click+0.18, abPt(170,320), 1],
  [K.c2TypeA, abPt(250,420)],
  [K.c3Move, abPt(250,420)],
  [K.c3Click-0.2, layPt(0)], [K.c3Click, layPt(0), 1],
  [K.outro, layPt(0)],
];

function cursorAt(t){
  let p=CUR[0][1], click=0;
  for(let i=0;i<CUR.length-1;i++){
    const [ta,pa]=CUR[i],[tb,pb]=CUR[i+1];
    if(t>=ta && t<=tb){ const x=ease(clamp((t-ta)/(tb-ta||1))); p={x:lerp(pa.x,pb.x,x),y:lerp(pa.y,pb.y,x)}; break; }
    if(t>tb) p=pb;
  }
  for(const [tc,,c] of CUR) if(c && t>=tc && t<tc+0.16) click=1-Math.abs((t-tc)/0.08-1);
  return {p,click};
}

/* ---------- draw frame t ---------- */
function render(t){
  // intro / outro captions
  const introA = seg(t,K.introIn,K.introIn+0.6)*(1-seg(t,K.introOut,K.introOut+0.5));
  $("#intro").style.opacity=introA;
  $("#intro").style.transform=`translateY(${(1-seg(t,K.introIn,K.introIn+0.8))*14}px)`;
  const out = seg(t,K.outro,K.outro+0.9);
  const outText = seg(t,K.outro+0.5,K.outro+1.3);
  $("#outro").style.opacity=outText;
  $("#outro").style.transform=`translateY(${(1-outText)*16}px)`;

  // cards rise in, then sink away for the outro
  const cin = seg(t,K.cardsIn,K.cardsIn+1.0);
  for(const [id,delay] of [["#editor",0],["#phone",0.15]]){
    const x = seg(t,K.cardsIn+delay,K.cardsIn+delay+1.0);
    const el=$(id);
    el.style.opacity = x*(1-out);
    el.style.transform = `translateY(${(1-x)*36 + out*30}px) scale(${1-out*0.04})`;
  }

  // design state: editor now, phone LAG seconds behind
  const ed = design(t), ph = design(t-LAG);
  ed.selected = t>=K.c1Click-0.25 && t<K.c2Move ? "cta" : (t>=K.c2Click && t<K.c3Move ? "title" : null);
  $("#edApp").innerHTML = appHTML(ed,true);
  const ea=$("#edApp .app"); ea.style.transform=`translate(${AB.x}px,${AB.y}px) scale(${AB_SCALE})`;
  $("#ablabel").style.left=AB.x+"px"; $("#ablabel").style.top=(AB.y-18)+"px";
  $("#phApp").innerHTML = appHTML(ph,false);
  $("#phApp .app").style.transform=`scale(${PH_SCALE})`;

  // psmirror bar on the phone: visible when it appears, then auto-hides like the real page
  const bar = seg(t,K.cardsIn+0.6,K.cardsIn+1.0)*(1-seg(t,K.cardsIn+2.6,K.cardsIn+3.0));
  $("#mbar").style.opacity=bar;
  const clk=9*3600+41*60+Math.floor(Math.max(0,t)); $("#clock").textContent=
    [Math.floor(clk/3600),Math.floor(clk/60)%60,clk%60].map(n=>String(n).padStart(2,"0")).join(":");

  // panel: swatches + layers
  const fillSel = ed.cta?2:0;
  $("#swatches").innerHTML = SW.map((c,i)=>`<span class="sw${i===fillSel?" sel":""}" style="background:${c}"></span>`).join("");
  $("#layers").innerHTML = LAYERS.map(([n,k],i)=>{
    const on = k==="badge" ? ed.badge : true;
    const s = (ed.selected && ed.selected===k) || (k==="badge" && t>=K.c3Click-0.2 && t<K.outro);
    return `<div class="lay${s?" sel":""}"><span class="eye${on?"":" off"}"></span><span class="thumb"></span>${n}</div>`;
  }).join("");

  // step captions
  const steps=[[K.c1Move-0.2,K.c2Move-0.4,"Change a color"],[K.c2Move-0.2,K.c3Move-0.4,"Edit text"],[K.c3Move-0.2,K.outro-0.2,"Toggle a layer"]];
  let cap="",ca=0;
  for(const [a,b,txt] of steps) if(t>=a-0.1 && t<b+0.5){ cap=txt; ca=seg(t,a,a+0.4)*(1-seg(t,b,b+0.4)); }
  let push=0;
  for(const p of PUSHES) push=Math.max(push, seg(t,p.a,p.a+0.9)*(1-seg(t,p.b,p.b+0.9)));
  $("#step").textContent=cap; $("#step").style.opacity=ca*(1-Math.min(1,push*3));

  // cursor
  const c=cursorAt(t);
  const cur=$("#cursor");
  cur.style.opacity = seg(t,K.cardsIn+0.8,K.cardsIn+1.3)*(1-seg(t,K.outro-0.4,K.outro));
  cur.style.transform=`translate(${c.p.x-3}px,${c.p.y-3}px) scale(${1-c.click*0.18})`;

  // camera: gentle push onto the phone after each change
  let z=0;
  for(const p of PUSHES) z=Math.max(z, seg(t,p.a,p.a+0.9)*(1-seg(t,p.b,p.b+0.9)));
  const s=1+0.2*z;
  $("#cam").style.transform=`translate(${PHONE_C.x*(1-s)}px,${PHONE_C.y*(1-s)}px) scale(${s})`;
}

window.render=render; window.DURATION=DURATION;

// Preview in a browser: #t=5.2 to show one frame, #play to loop
const h=location.hash;
if(h.startsWith("#t=")) render(parseFloat(h.slice(3)));
else if(h==="#play"){ const t0=performance.now(); const tick=()=>{ render(((performance.now()-t0)/1000)%DURATION); requestAnimationFrame(tick); }; tick(); }
else render(K.c1Click+LAG+1);
</script>
</body>
</html>
